<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team1 Design System 3.0.0 · preview</title>
    <script>
      // ?theme=light|dark sets an explicit theme; otherwise CSS follows the OS and defaults to dark.
      (function () {
        var t = new URLSearchParams(location.search).get("theme")
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
